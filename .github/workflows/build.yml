name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package
        run: python -I tools/package_release.py

      - name: Privacy scan (generic checks + this runner's names)
        run: python -I tools/privacy_scan.py dist --allow tools/privacy_allow.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            dist/*.zip
            dist/*.sha256
